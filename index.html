<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillBridge – Soft Skills Training for Overseas Jobs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌉%3C/text%3E%3C/svg%3E">
<style>
:root{--p:#0b5d44;--pt:#fff;--a:#f08c00;--bg:#f5f6f3;--t:#1a231f;--m:#5d6a63;--c:#fff;--b:#dfe4de;--ok:#16794c;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--p:#5fd0a0;--pt:#06241a;--bg:#0f1512;--t:#e7ede9;--m:#9aaaa1;--c:#171f1b;--b:#26322c;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,"Segoe UI",Roboto,"Noto Nastaliq Urdu",sans-serif;background:var(--bg);color:var(--t)}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}h1{font-size:clamp(28px,6vw,46px)}h2{font-size:26px}
a{color:var(--p)}
.w{max-width:1050px;margin:auto;padding:28px 18px}.narrow{max-width:480px}
header{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:1px solid var(--b)}
header .w{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:10px}
.logo{font-weight:800;font-size:21px;text-decoration:none;color:var(--p)}
nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}nav a{text-decoration:none;font-weight:600}
.btn{display:inline-block;padding:10px 18px;border:0;border-radius:8px;background:var(--p);color:var(--pt);font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;text-decoration:none}
nav a.btn{color:var(--pt)}
.btn.a{background:var(--a);color:#1b1200}.btn.o{background:none;border:1.5px solid currentColor;color:inherit}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.hero{position:relative;overflow:hidden;background:#0b2e24;color:#fff}
.hbs{position:absolute;inset:0;z-index:0}
.hb{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1);transition:opacity 1.2s ease,transform 9s ease-out}.hb.on{opacity:1;transform:scale(1.08)}
.ar{position:absolute;top:50%;z-index:3;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid #ffffff77;background:#0007;color:#fff;font-size:24px;line-height:1;cursor:pointer}.ar:hover{background:#000a}.ar.l{left:14px}.ar.r{right:14px}
.dots{position:absolute;bottom:14px;left:0;right:0;z-index:3;display:flex;justify-content:center;gap:8px}.dots button{width:10px;height:10px;padding:0;border:0;border-radius:6px;background:#ffffff77;cursor:pointer;transition:width .3s}.dots button.on{width:26px;background:#fff}
.hero{display:flex;align-items:center;justify-content:center;min-height:min(80vh,620px)}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(5,18,14,.62),rgba(5,18,14,.48) 50%,rgba(5,18,14,.82))}
.hi{position:relative;z-index:2;width:100%;text-align:center;padding:84px 18px 64px}.hero h1{text-shadow:0 2px 18px #000a}.hero p{max-width:62ch;margin:0 auto 18px;color:#e6ece8}
.sb{display:flex;max-width:560px;margin:22px auto 0;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border:1px solid #ffffff44;border-radius:999px;padding:5px}
.sb input{flex:1;min-width:0;margin:0;background:transparent;border:0;color:#fff;padding:10px 16px;border-radius:999px}.sb input::placeholder{color:#e6ece8aa}.sb .btn{border-radius:999px}
.sb.lt{background:var(--c);border-color:var(--b);max-width:none;margin:0 0 18px}.sb.lt input{color:var(--t)}.sb.lt input::placeholder{color:var(--m)}
.mq{position:relative;overflow:hidden;white-space:nowrap;color:#f6efd2;font-size:13.5px;border-bottom:1px solid rgba(240,200,90,.4);background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 55%),linear-gradient(90deg,#082a20,#12503a 50%,#082a20);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.mq::after{content:"";position:absolute;top:0;bottom:0;left:-35%;width:28%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);animation:shim 5s ease-in-out infinite;pointer-events:none}
@keyframes shim{0%{left:-35%}60%,100%{left:125%}}
.mqt{display:flex;width:max-content;padding:7px 0;animation:mq var(--mqd,40s) linear infinite}.mq:hover .mqt,.mq:active .mqt{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mi{flex:none;margin-right:48px;display:inline-flex;align-items:center;gap:8px}
.bdg{padding:1px 9px;border-radius:99px;font-size:11px;letter-spacing:.06em}
.bdg.g{background:linear-gradient(#ffe38a,#e0a800);color:#3a2a00;box-shadow:0 0 10px #ffd54fcc}
.bdg.n{background:#39ff88;color:#04210f;box-shadow:0 0 10px #39ff88cc}
@media(prefers-reduced-motion:reduce){.mqt,.mq::after{animation:none}.mq{overflow-x:auto}.hb{transition:opacity 1.2s}}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 36px;margin-top:34px;padding-top:20px;border-top:1px solid #ffffff44}
.stats div{font-size:14px;color:#d0d8ee}.stats b{display:block;font-size:30px;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:18px;margin:0 0 14px}
.grid .card{margin:0}.card h3{margin-bottom:.3em}.ic{font-size:30px}
.cc{display:block;text-decoration:none;color:inherit}.cc:hover{border-color:var(--a)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--a);color:#1b1200;font-size:12px;font-weight:700}
.price{font-weight:800;font-size:20px}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.path div{padding:6px 18px 6px 0;border-top:4px solid var(--a)}.path b{display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}.gal figure{margin:0}.gal figcaption{font-size:13px;color:var(--m)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start}
@media(max-width:760px){.two{grid-template-columns:1fr}}
label{display:block;margin:12px 0;font-weight:600;font-size:14px}
.ur{float:right;font-weight:400;color:var(--m)}
input,textarea,select{width:100%;padding:10px 12px;margin-top:4px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
fieldset{border:1px solid var(--b);border-radius:8px;margin:0 0 14px}legend{font-weight:700;padding:0 6px}
.op{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:6px 0}.op input{width:auto;margin-top:6px}
.bar{height:10px;background:var(--b);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}
.les{display:block;padding:9px 0;border-top:1px solid var(--b);text-decoration:none;color:var(--t)}
.vid{position:relative;padding-top:56.25%;margin-bottom:14px}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}
details.card summary{cursor:pointer;font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
ul.tick{padding-left:0;list-style:none}ul.tick li::before{content:"✔ ";color:var(--ok)}
footer{text-align:center;color:var(--m);font-size:14px;padding:26px 18px;border-top:1px solid var(--b)}
#cb{position:fixed;right:14px;bottom:14px;z-index:6;box-shadow:0 4px 14px #0004}
#chat{display:none;position:fixed;right:14px;bottom:66px;z-index:6;width:min(360px,calc(100vw - 28px));background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px}
#chat.open{display:block}#cm{height:260px;overflow:auto;font-size:14px}#cm p{margin:6px 0;padding:8px 10px;border-radius:8px;background:var(--bg)}#cm p.user{background:var(--p);color:var(--pt);margin-left:30px}
#cf{display:flex;gap:6px;margin-top:8px}#cf input{margin:0}
/* certificate: always light so it prints well */
.cert{position:relative;background:#fffdf6;color:#1d2b25;text-align:center;padding:44px 26px 28px;border:3px solid #b8892b;box-shadow:0 0 0 9px #fffdf6,0 0 0 13px #0b4f3a;margin:14px;font-family:Georgia,"Times New Roman",serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert::before{content:"";position:absolute;inset:8px;border:1px solid #b8892b;pointer-events:none}
.cert .band{height:8px;background:linear-gradient(90deg,#0b4f3a,#b8892b,#0b4f3a);margin:-44px -26px 26px}
.cert h4{letter-spacing:.3em;margin:6px 0;color:#0b4f3a;font-size:15px}.cert h1{font-style:italic;color:#0b4f3a;margin:.2em 0;font-size:clamp(28px,6vw,44px)}.cert h2{color:#b8892b;font-size:24px}
.seal{width:64px;height:64px;line-height:64px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(#e9c46a,#b8892b);color:#fff;font-size:30px;box-shadow:0 0 0 4px #fffdf6,0 0 0 6px #b8892b}
.cf{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:26px 0 10px;flex-wrap:wrap}.cf>div{flex:1;min-width:130px}
.sig{border-top:1px solid #1d2b25;padding-top:4px;font-style:italic;display:inline-block;min-width:130px}
.qr img{width:96px;height:96px;image-rendering:pixelated;background:#fff;padding:4px;border:1px solid #ccc}
@media print{header,footer,#cb,#chat,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header><div id="mq" class="mq" hidden></div><div class="w"><a class="logo" href="#/">🌉 SkillBridge</a><nav id="nav"></nav></div></header>
<main id="app"></main>
<footer>© 2026 SkillBridge. Developed by Mehreen Riaz – <a href="mailto:mehreenriaz1532@gmail.com">mehreenriaz1532@gmail.com</a> · <a href="/admin.html">Admin</a></footer>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tok=localStorage.getItem('t'),D=null,hist=[],hT;
const go=h=>location.hash===h?render():(location.hash=h);
const err=e=>alert(e.message);
const fv=f=>Object.fromEntries(new FormData(f));
const setTok=t=>{tok=t;localStorage.setItem('t',t)};
const money=n=>n>0?'Rs. '+Number(n).toLocaleString('en-PK'):'Free';
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const okUrl=u=>/^https?:\/\//i.test(u||'');
const fld=(n,l,u,t='text',req=1)=>`<label>${l}<span class="ur">${u}</span><input name="${n}" type="${t}" ${req?'required':''}></label>`;
const yt=u=>{const m=String(u||'').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?`<div class="vid"><iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe></div>`:''};
function logout(){tok=null;D=null;hist=[];localStorage.removeItem('t');$('#chat')?.remove();$('#cb')?.remove();go('#/')}
async function api(a,b={}){
  const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:JSON.stringify({a,...b})});
  const j=await r.json().catch(()=>({error:'Server error'}));
  if(!r.ok){if(r.status===401&&tok)logout();throw new Error(j.error||'Error')}
  return j;
}
function nav(){$('#nav').innerHTML='<a href="#/courses">Courses</a><a href="#/contact">Contact</a>'+(tok?'<a href="#/dash">My learning</a><a href="#" onclick="logout();return false">Logout</a>':'<a href="#/login">Login</a><a class="btn" href="#/register">Register</a>')}

async function render(){
  nav();clearInterval(hT);
  const [,r,p]=(location.hash.slice(1)||'/').split('/');
  try{
    if(['dash','learn','lesson','exam','cert','pay'].includes(r)&&!tok)return go('#/login');
    window.scrollTo(0,0);
    await({login:loginV,register:regV,forgot:forgotV,reset:()=>resetV(p),courses:()=>coursesV(p),contact:async()=>{await home();$('#contact')?.scrollIntoView()},course:()=>courseV(p),pay:()=>payV(p),dash,learn:()=>learn(p),lesson:()=>lesson(p),exam:()=>exam(p),cert:()=>cert(p),verify:()=>verifyV(p)}[r]||home)();
  }catch(e){app.innerHTML=`<div class="w"><p class="bad">${esc(e.message)}</p></div>`}
}
addEventListener('hashchange',render);render();

/* ---------- hero: background carousel (photos come from the admin; fades every few seconds) ---------- */
const SCN=[['#0b3d2e','#1f7a5a'],['#262626','#5c4a32'],['#14452f','#7fb069'],['#4a1c1c','#9c4a3a'],['#232826','#4b5a52'],['#3b2f1e','#b08a3e']];
const scene=(c,i)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 600' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${c[0]}'/><stop offset='1' stop-color='${c[1]}'/></linearGradient></defs><rect width='1200' height='600' fill='url(#g)'/><circle cx='${200+i*160}' cy='140' r='70' fill='#fff' opacity='.15'/><path d='M0 520 L150 380 L300 500 L470 330 L640 490 L800 360 L1000 500 L1200 400 V600 H0Z' fill='#000' opacity='.28'/></svg>`);
function slider(urls,sec){
  urls=urls.slice(0,10);const box=$('#hbs'),dots=$('#dots');
  box.innerHTML=urls.map(u=>`<div class="hb" style="background-image:url('${u.replace(/'/g,'%27').replace(/"/g,'%22')}')"></div>`).join('');
  dots.innerHTML=urls.map((_,k)=>`<button aria-label="Slide ${k+1}"></button>`).join('');
  const sl=[...box.children],dt=[...dots.children];let i=0;
  const show=n=>{i=(n+sl.length)%sl.length;sl.forEach((s,k)=>s.classList.toggle('on',k===i));dt.forEach((d,k)=>d.classList.toggle('on',k===i))};
  const run=()=>{clearInterval(hT);if(sl.length>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches)hT=setInterval(()=>show(i+1),sec*1000)};
  show(Math.random()*sl.length|0);run();
  $('#pv').onclick=()=>{show(i-1);run()};$('#nx').onclick=()=>{show(i+1);run()};dt.forEach((d,k)=>d.onclick=()=>{show(k);run()});
  if(sl.length<2)$('#pv').hidden=$('#nx').hidden=dots.hidden=true;
}
/* ---------- announcement bar above the menu (text comes from the admin Announcements tab) ---------- */
async function loadMq(){
  try{
    const c=await api('content'),box=$('#mq');
    if(c.settings.marquee_on===false||!c.announcements.length){box.hidden=true;return}
    const it=c.announcements.map(a=>`<span class="mi"><b class="bdg ${a.pinned?'g':'n'}">${a.pinned?'HOT':'NEW'}</b>${esc(a.title)}</span>`).join('');
    const rep=Math.max(1,Math.ceil(8/c.announcements.length)),half=it.repeat(rep),chars=c.announcements.reduce((s,a)=>s+a.title.length+10,0)*rep;
    box.innerHTML=`<div class="mqt" style="--mqd:${Math.max(20,chars*.28)|0}s">${half}${half}</div>`;box.hidden=false;
  }catch{}
}
loadMq();
const cardC=c=>`<a class="card cc" href="#/course/${c.id}"><div class="ic">${esc(c.icon)}</div>${c.is_demo?'<span class="badge">FREE DEMO</span>':''}<h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p><span class="price">${money(c.price)}</span></a>`;

async function home(){
  const [c,s]=await Promise.all([api('content'),api('stats')]),S=c.settings,faq=Array.isArray(S.faqs)?S.faqs:[];
  const imgs=(Array.isArray(S.hero_images)?S.hero_images:[]).filter(okUrl);
  app.innerHTML=`<section class="hero"><div class="hbs" id="hbs" aria-hidden="true"></div><button class="ar l" id="pv" aria-label="Previous photo">‹</button><button class="ar r" id="nx" aria-label="Next photo">›</button><div class="dots" id="dots"></div><div class="w hi"><h1>${esc(S.hero_title)}</h1><p>${esc(S.hero_sub)}</p>
  <p><a class="btn a" href="${tok?'#/courses':'#/register'}">${esc(S.hero_cta||'Start Learning')}</a></p>
  <form class="sb" id="hs"><input id="hq" placeholder="Search courses, e.g. English or communication" aria-label="Search courses"><button class="btn">Search</button></form>
  <div class="stats">${[['Trainees',s.trainees],['Completion rate',s.rate+'%'],['Certificates issued',s.certificates],['Lessons',s.lessons]].map(x=>`<div><b>${x[1]}</b>${x[0]}</div>`).join('')}</div></div></section>
  ${c.announcements.length?`<section class="w"><h2>📢 Announcements</h2>${c.announcements.slice(0,5).map(a=>`<div class="card">${a.pinned?'📌 ':''}<b>${esc(a.title)}</b> <small>${new Date(a.created_at).toLocaleDateString()}</small><p>${esc(a.body)}</p></div>`).join('')}</section>`:''}
  <section class="w"><h2>About SkillBridge</h2><p>${esc(S.about)}</p><div class="grid">${[['🎓','Structured courses','Short lessons, a quiz and a final test in every course.'],['📅','Live classes','Join live sessions with your instructor on Zoom.'],['✅','Verified certificates','Every certificate carries a QR code anyone can scan.'],['🗣️','Urdu and English','Clear, simple language made for workers heading abroad.']].map(x=>`<div class="card"><div class="ic">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></section>
  <section class="w"><h2>Courses</h2><div class="grid">${c.courses.map(cardC).join('')}</div></section>
  ${c.gallery.length?`<section class="w"><h2>Gallery</h2><div class="gal">${c.gallery.filter(g=>okUrl(g.image_url)||okUrl(g.link)).map(g=>{const L=okUrl(g.link)?g.link:'',f=okUrl(g.image_url)?`<figure><img loading="lazy" src="${esc(g.image_url)}" alt="${esc(g.caption)}"><figcaption>${esc(g.caption)}${L?' · open link':''}</figcaption></figure>`:`<div class="card">📄 <b>${esc(g.caption||'Open document')}</b></div>`;return L?`<a class="cc" href="${esc(L)}" target="_blank" rel="noopener">${f}</a>`:f}).join('')}</div></section>`:''}
  <section class="w"><h2>How it works</h2><div class="path"><div><b>1. Register</b>Create your account with your CNIC.</div><div><b>2. Learn</b>Finish lessons at your own pace and join live classes.</div><div><b>3. Get certified</b>Pass the final test and download your certificate.</div></div></section>
  <section class="w narrow"><h2>Verify a certificate</h2><div class="card"><input id="vc" placeholder="Certificate ID, e.g. SB-1A2B3C4D"><p><button class="btn" onclick="go('#/verify/'+encodeURIComponent($('#vc').value.trim()))">Verify</button></p></div></section>
  ${(()=>{const ce=/^\S+@\S+\.\S+$/.test(S.contact_email||'')?S.contact_email:'',cp=String(S.contact_phone||'').trim(),ad=String(S.contact_address||'').trim();return ce||cp||ad?`<section class="w" id="contact"><h2>Contact us</h2><div class="grid">${ce?`<a class="card cc" href="mailto:${esc(ce)}"><div class="ic">✉️</div><h3>Email</h3><p>${esc(ce)}</p></a>`:''}${cp?`<a class="card cc" href="tel:${esc(cp.replace(/[^\d+]/g,''))}"><div class="ic">📞</div><h3>Phone</h3><p>${esc(cp)}</p></a>`:''}${ad?`<div class="card"><div class="ic">📍</div><h3>Address</h3><p>${esc(ad)}</p></div>`:''}</div></section>`:''})()}
  <section class="w"><h2>Frequently asked questions</h2>${faq.map(f=>`<details class="card"><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('')}</section>`;
  slider(imgs.length?imgs:SCN.map(scene),Math.min(15,Math.max(3,+S.hero_interval||5)));
  $('#hs').onsubmit=e=>{e.preventDefault();go('#/courses/'+encodeURIComponent($('#hq').value.trim()))};
  if(tok)chatUI();
}
async function verifyV(code){
  const r=await api('verify',{code});
  app.innerHTML=`<div class="w narrow card"><h2>Certificate check</h2>${!r.name?'<p class="bad">Certificate not found. Check the ID and try again.</p>':r.valid?`<p class="ok"><b>✔ Valid certificate</b></p><p><b>${esc(r.name)}</b><br>CNIC ${esc(r.cnic)}<br>Course: ${esc(r.course||'')}<br>Score ${r.score}%<br>Issued ${new Date(r.issued_at).toLocaleDateString()}<br>ID ${esc(r.code)}</p>`:'<p class="bad">This certificate has been revoked.</p>'}</div>`;
}

/* ---------- courses (Coursera style: list, then a detail page) ---------- */
async function coursesV(q){
  q=decodeURIComponent(q||'');const c=await api('content'),k=q.toLowerCase();
  const list=c.courses.filter(x=>!k||(x.title+' '+x.summary).toLowerCase().includes(k));
  app.innerHTML=`<div class="w"><h2>All courses</h2><form class="sb lt" id="cs"><input id="cq" value="${esc(q)}" placeholder="Search courses" aria-label="Search courses"><button class="btn">Search</button></form><div class="grid">${list.map(cardC).join('')||'<p>No courses match your search.</p>'}</div></div>`;
  $('#cs').onsubmit=e=>{e.preventDefault();go('#/courses/'+encodeURIComponent($('#cq').value.trim()))};
}
async function courseV(id){
  const c=await api('course',{id});
  if(tok&&!D)try{D=await api('me')}catch{}
  const en=D?.courses?.some(x=>x.id==c.id),pend=D?.pays?.some(p=>p.course_id==c.id&&p.status==='pending');
  const n=c.modules.reduce((s,m)=>s+m.lessons.length,0);
  const cta=en?`<a class="btn a" href="#/learn/${c.id}">Go to course</a>`:!tok?'<a class="btn a" href="#/register">Register to start</a> <a class="btn o" href="#/login">Login</a>':c.price>0?(pend?'<p class="ok">Payment received. You get access as soon as it is approved.</p>':`<a class="btn a" href="#/pay/${c.id}">Buy now</a>`):`<button class="btn a" onclick="enroll(${c.id})">Start free</button>`;
  app.innerHTML=`<div class="w"><div class="two"><div><div class="ic">${esc(c.icon)}</div>${c.is_demo?'<span class="badge">FREE DEMO</span>':''}<h1>${esc(c.title)}</h1><p>${esc(c.summary)}</p>
  <h2>About this course</h2><p>${esc(c.description)}</p>
  ${lines(c.benefits).length?`<h2>Why it matters</h2><ul class="tick">${lines(c.benefits).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  ${lines(c.outcomes).length?`<h2>What you will learn</h2><ul class="tick">${lines(c.outcomes).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  <h2>Syllabus</h2>${c.modules.map(m=>`<details class="card"><summary>${esc(m.title)} (${m.lessons.length} lessons)</summary>${m.lessons.map(l=>`<div class="les">• ${esc(l.title)}</div>`).join('')}</details>`).join('')}</div>
  <div class="card"><div class="price">${money(c.price)}</div><p>${n} lessons<br>Instructor: ${esc(c.instructor||'SkillBridge Team')}<br>Quiz, live classes and certificate with QR code</p>${cta}</div></div></div>`;
}
async function enroll(id){try{await api('enroll',{course_id:id});D=null;go('#/learn/'+id)}catch(e){err(e)}}

/* ---------- payment (manual: bank / JazzCash / EasyPaisa) ---------- */

  app.innerHTML=`<form class="w narrow card" id="f"><h2>Buy: ${esc(c.title)}</h2><p class="price">${money(c.price)}</p>
  <div class="card" style="white-space:pre-wrap">${esc(ct.settings.pay_info)}</div>
  <label>Payment method<select name="method"><option value="jazzcash">JazzCash</option><option value="easypaisa">EasyPaisa</option><option value="bank">Bank transfer</option></select></label>
  <label>Amount paid (Rs.)<input name="amount" type="number" value="${c.price}" required></label>
  <label>Your name / account number<input name="sender" required></label>
  <label>Transaction ID<input name="trx_id" required minlength="6"></label>
  <label>Screenshot link (optional)<input name="proof_url" type="url" placeholder="https://..."></label>

  ${fld('first_name','First name','پہلا نام')}${fld('middle_name','Middle name','درمیانی نام','text',0)}${fld('last_name','Last name','آخری نام')}${fld('dob','Date of birth','تاریخ پیدائش','date')}
  ${fld('cnic','CNIC (13 digits)','شناختی کارڈ نمبر')}${fld('cnic2','Confirm CNIC','شناختی کارڈ نمبر کی تصدیق')}${fld('email','Email address','ای میل ایڈریس','email')}${fld('phone','Mobile number','موبائل نمبر','tel',0)}${fld('password','Password (6+ characters)','پاس ورڈ','password')}

function forgotV(){
  app.innerHTML=`<form class="w narrow card" id="f"><h2>Forgot password</h2><p>Enter your CNIC or the email you registered with. We will email you a reset link.</p>${fld('who','CNIC or email','')}<button class="btn">Send reset link</button><p><a href="#/login">Back to login</a></p></form>`;
  $('#f').onsubmit=async e=>{e.preventDefault();try{await api('forgot',fv(e.target));app.innerHTML='<div class="w narrow card"><h2>Check your email</h2><p>If an account exists, a reset link has been sent. It works for 1 hour. Check the spam folder too.</p></div>'}catch(x){err(x)}};

function resetV(token){
  app.innerHTML=`<form class="w narrow card" id="f"><h2>Choose a new password</h2>${fld('password','New password (6+ characters)','','password')}${fld('p2','Repeat password','','password')}<button class="btn">Change password</button></form>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const v=fv(e.target);if(v.password!==v.p2)return alert('Passwords do not match');try{await api('reset',{token,password:v.password});alert('Password changed. Please login.');go('#/login')}catch(x){err(x)}};

/* ---------- learning area ---------- */
const pct=(c,dn)=>{const L=c.modules.flatMap(m=>m.lessons);return{n:L.filter(l=>dn.has(l.id)).length,t:L.length}};
async function dash(){
  D=await api('me');const dn=new Set(D.done);
  const pend=D.pays.filter(p=>p.status==='pending'),rej=D.pays.filter(p=>p.status==='rejected');
  app.innerHTML=`<div class="w"><h2>Hello, ${esc(D.me.first_name)}</h2>
  ${pend.length?`<div class="card">⏳ ${pend.length} payment(s) waiting for admin approval.</div>`:''}${rej.length?`<div class="card bad">A payment was rejected. Check the transaction ID or contact support, then submit again.</div>`:''}
  <h3>My courses</h3>${D.courses.map(c=>{const p=pct(c,dn),q=p.t?Math.round(p.n/p.t*100):0;return`<a class="card cc" href="#/learn/${c.id}"><h3>${esc(c.icon)} ${esc(c.title)}</h3><b>${q}% complete</b> (${p.n} of ${p.t} lessons)<div class="bar"><i style="width:${q}%"></i></div></a>`}).join('')||'<div class="card"><p>You are not enrolled in any course yet.</p></div>'}
  <p><a class="btn a" href="#/courses">Browse courses</a></p>
  ${D.live.length?`<h3>📅 Live classes</h3>${D.live.map(l=>`<div class="card"><b>${esc(l.title)}</b><br>${new Date(l.starts_at).toLocaleString()}${l.notes?`<br><small>${esc(l.notes)}</small>`:''}${okUrl(l.link)?`<p><a class="btn" href="${esc(l.link)}" target="_blank" rel="noopener">Join class</a></p>`:''}</div>`).join('')}`:''}</div>`;
  chatUI();
}
async function learn(id){
  if(!D)D=await api('me');
  const c=D.courses.find(x=>x.id==id);if(!c)return go('#/course/'+id);
  const dn=new Set(D.done),p=pct(c,dn),q=p.t?Math.round(p.n/p.t*100):0,ct=D.certs.find(x=>x.course_id==id);
  app.innerHTML=`<div class="w"><a href="#/dash">← My learning</a><h2>${esc(c.icon)} ${esc(c.title)}</h2><div class="card"><b>${q}% complete</b> (${p.n} of ${p.t} lessons)<div class="bar"><i style="width:${q}%"></i></div></div>
  ${c.modules.map(m=>`<div class="card"><h3>${esc(m.icon)} ${esc(m.title)}</h3>${m.lessons.map(l=>`<a class="les" href="#/lesson/${l.id}">${dn.has(l.id)?'✅':'⬜'} ${esc(l.title)}</a>`).join('')}</div>`).join('')}
  <div class="card"><h3>🎓 Final test and certificate</h3>${ct?`<a class="btn" href="#/cert/${id}">View certificate</a>`:q===100?`<a class="btn a" href="#/exam/${id}">Start final test</a>`:'<p>Finish all lessons to unlock the final test.</p>'}</div></div>`;
  chatUI();
}
async function lesson(id){
  if(!D)D=await api('me');
  const c=D.courses.find(c=>c.modules.some(m=>m.lessons.some(l=>l.id==id)));
  const l=await api('lesson',{id}),L=c?c.modules.flatMap(m=>m.lessons):[],nx=L[L.findIndex(x=>x.id==id)+1];
  app.innerHTML=`<div class="w" style="max-width:760px"><a href="#/learn/${c?c.id:''}">← Back to course</a><h2>${esc(l.title)}</h2>${yt(l.video_url)}<div class="card">${esc(l.content).replace(/\n/g,'<br>')}</div><button class="btn" id="dn">${D.done.includes(l.id)?'Next':'Mark complete and continue'}</button></div>`;
  $('#dn').onclick=async()=>{try{if(!D.done.includes(l.id)){await api('done',{id:l.id});D.done.push(l.id)}go(nx?'#/lesson/'+nx.id:'#/learn/'+(c?c.id:''))}catch(e){err(e)}};
  chatUI();
}
async function exam(cid){
  const x=await api('exam',{course_id:+cid});
  app.innerHTML=`<form class="w card" id="f" style="max-width:760px"><h2>Final test</h2><p>Pass mark: ${x.pass}%</p>${x.questions.map((q,i)=>`<fieldset><legend>${i+1}. ${esc(q.question)}</legend>${q.options.map((o,j)=>`<label class="op"><input type="radio" name="${q.id}" value="${j}" required> ${esc(o)}</label>`).join('')}</fieldset>`).join('')}<button class="btn">Submit answers</button></form>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const a={};for(const[k,v]of new FormData(e.target))a[k]=+v;
    try{const r=await api('submit',{course_id:+cid,answers:a});D=null;app.innerHTML=`<div class="w narrow card"><h2>${r.passed?'You passed':'Not passed yet'}</h2><p>Your score: ${r.score}%</p>${r.passed?`<a class="btn" href="#/cert/${cid}">Get certificate</a>`:'<button class="btn" onclick="render()">Try again</button>'}</div>`}catch(x){err(x)}};
}

/* ---------- certificate with QR code ---------- */
const qrLib=()=>window.qrcode?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function cert(cid){
  if(!D)D=await api('me');
  const ct=D.certs.find(x=>x.course_id==cid),co=D.courses.find(x=>x.id==cid);if(!ct||!co)return go('#/dash');
  const n=[D.me.first_name,D.me.middle_name,D.me.last_name].filter(Boolean).join(' '),url=location.origin+'/#/verify/'+ct.id;
  app.innerHTML=`<div class="w"><div class="cert"><div class="band"></div><div class="seal">★</div><h4>CERTIFICATE OF COMPLETION</h4><p>This is to certify that</p><h1>${esc(n)}</h1><p>has successfully completed the course</p><h2>${esc(co.title)}</h2><p>with a score of ${ct.score}%</p>
  <div class="cf"><div><span class="sig">SkillBridge</span><br><small>Authorised by SkillBridge</small></div><div><b>${esc(ct.id)}</b><br><small>Issued ${new Date(ct.issued_at).toLocaleDateString()}</small></div><div class="qr" id="qr"></div></div>
  <small>Scan the QR code to verify this certificate online.</small></div><p class="noprint"><button class="btn" onclick="print()">Print or save as PDF</button></p></div>`;
  try{await qrLib();const q=qrcode(0,'M');q.addData(url);q.make();$('#qr').innerHTML=q.createImgTag(4,2)}catch{$('#qr').textContent=ct.id}
}

/* ---------- AI mentor ---------- */
function chatUI(){
  if($('#chat'))return;
  document.body.insertAdjacentHTML('beforeend','<button id="cb" class="btn a" onclick="$(\'#chat\').classList.toggle(\'open\')">🤖 AI mentor</button><div id="chat"><div id="cm"><p>Ask me anything about communication, teamwork or working abroad. اردو میں بھی پوچھ سکتے ہیں۔</p></div><form id="cf"><input id="ci" placeholder="Type your question" required><button class="btn">Send</button></form></div>');
  $('#cf').onsubmit=async e=>{e.preventDefault();const t=$('#ci').value;$('#ci').value='';add('user',t);
    try{add('assistant',(await api('mentor',{message:t,history:hist.slice(0,-1)})).reply)}catch(x){add('assistant',x.message)}};
}
function add(r,t){hist.push({role:r,content:t});$('#cm').insertAdjacentHTML('beforeend',`<p class="${r}">${esc(t)}</p>`);$('#cm').scrollTop=1e9}
</script>
