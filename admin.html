<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SkillBridge Admin</title>
<style>
:root{--p:#16264a;--pt:#fff;--a:#f08c00;--bg:#f5f7fa;--t:#17203a;--m:#5b6580;--c:#fff;--b:#dde2ec}
@media(prefers-color-scheme:dark){:root{--p:#8fa8ff;--pt:#0c1630;--bg:#0c1328;--t:#e8ecf6;--m:#9aa5c3;--c:#141d38;--b:#25305a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
.w{max-width:1100px;margin:auto;padding:18px}.narrow{max-width:400px;margin-top:60px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.grid .card{margin:0}.grid b{font-size:28px}
button,.btn{padding:8px 14px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit;cursor:pointer}
.btn{background:var(--p);color:var(--pt);border:0;font-weight:600}.btn.a{background:var(--a);color:#1b1200}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.tabs button.on{background:var(--p);color:var(--pt)}
input,textarea{width:100%;padding:9px 11px;margin:4px 0 10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
input[type=checkbox]{width:auto}label{font-weight:600;font-size:14px;display:block}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--c)}th,td{padding:8px 10px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top;font-size:14px}td button{margin:0 4px 4px 0;padding:4px 10px}
dialog{width:min(560px,94vw);border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:2px}
</style>
</head>
<body>
<div class="w"><h2>SkillBridge admin</h2><div id="app"></div></div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),app=$('#app'),dlg=$('#dlg');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tok=localStorage.getItem('at'),cur='dash';const cache={};
const fv=f=>Object.fromEntries(new FormData(f));
async function api(a,b={}){
  const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:JSON.stringify({a,...b})});
  const j=await r.json().catch(()=>({error:'Server error'}));
  if(!r.ok){if(r.status===401&&tok)out();throw new Error(j.error||'Error')}
  return j;
}
function out(){tok=null;localStorage.removeItem('at');show()}
const T={
  modules:{c:['id','icon','title','position','published'],f:[['title','Title'],['description','Description','ta'],['icon','Icon (one emoji)'],['position','Order','n'],['published','Published','b']]},
  lessons:{c:['id','module_id','title','position'],f:[['module_id','Module ID (see Modules tab)','n'],['title','Title'],['content','Lesson text','ta'],['video_url','YouTube link (optional)'],['position','Order','n']]},
  questions:{c:['id','module_id','question','answer'],f:[['module_id','Module ID','n'],['question','Question','ta'],['options','Options (one per line)','ta'],['answer','Correct option number (1, 2, 3...)','n']]},
  trainees:{c:['cnic','first_name','last_name','email','phone','created_at']},
  certificates:{c:['id','trainees','score','issued_at','revoked']}
};
const TABS=['dash','modules','lessons','questions','trainees','certificates','settings'];
function show(){
  if(!tok){
    app.innerHTML='<form class="card narrow" id="f"><h3>Admin login</h3><input name="user" placeholder="Username" required><input name="pass" type="password" placeholder="Password" required><button class="btn">Login</button></form>';
    $('#f').onsubmit=async e=>{e.preventDefault();try{tok=(await api('admin_login',fv(e.target))).token;localStorage.setItem('at',tok);show()}catch(x){alert(x.message)}};
    return;
  }
  app.innerHTML=`<div class="tabs">${TABS.map(t=>`<button data-t="${t}">${t}</button>`).join('')}<button onclick="out()">Logout</button></div><div id="pane"></div>`;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>tab(b.dataset.t));
  tab(cur);
}
async function tab(t){
  cur=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const p=$('#pane');
  try{
    if(t==='dash'){const s=await api('a_stats');p.innerHTML='<div class="grid">'+Object.entries(s).map(([k,v])=>`<div class="card"><b>${v}</b><br>${k}</div>`).join('')+'</div>'}
    else if(t==='settings')await settings(p);
    else await list(t,p);
  }catch(e){alert(e.message)}
}
const fmt=v=>v&&typeof v==='object'?(v.first_name?v.first_name+' '+v.last_name:JSON.stringify(v)):typeof v==='string'&&v.length>70?v.slice(0,70)+'…':v;
async function list(t,p){
  const rows=await api('a_list',{t}),c=T[t];cache[t]=rows;
  p.innerHTML=`<p>${c.f?`<button class="btn" onclick="edit('${t}')">+ Add</button> `:''}${t==='questions'?'<button class="btn a" onclick="aiq()">✨ Generate with AI</button>':''}</p>
  <div class="sc"><table><tr>${c.c.map(k=>`<th>${k}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${c.c.map(k=>`<td>${esc(fmt(r[k]))}</td>`).join('')}<td>${c.f?`<button onclick="edit('${t}',${r.id})">Edit</button>`:''}${t==='certificates'?`<button onclick="rv('${r.id}',${!r.revoked})">${r.revoked?'Restore':'Revoke'}</button>`:''}<button onclick="del('${t}','${r.id}')">Delete</button></td></tr>`).join('')}</table></div>`;
}
function edit(t,id){
  const c=T[t],r={...(id?cache[t].find(x=>x.id==id):{})};
  if(t==='questions'&&id){r.options=r.options.join('\n');r.answer=r.answer+1}
  dlg.innerHTML=`<form id="df"><h3>${id?'Edit':'Add'} ${t.slice(0,-1)}</h3>${c.f.map(([k,l,ty])=>`<label>${l}${ty==='ta'?`<textarea name="${k}" rows="5">${esc(r[k])}</textarea>`:ty==='b'?`<input name="${k}" type="checkbox" ${r[k]!==false?'checked':''}>`:`<input name="${k}" type="${ty==='n'?'number':'text'}" value="${esc(r[k])}">`}</label>`).join('')}<button class="btn">Save</button> <button type="button" onclick="dlg.close()">Cancel</button></form>`;
  dlg.showModal();
  $('#df').onsubmit=async e=>{
    e.preventDefault();const row={};
    c.f.forEach(([k,,ty])=>{const el=e.target.elements[k];row[k]=ty==='b'?el.checked:ty==='n'?(el.value===''?null:+el.value):el.value});
    if(id)row.id=id;
    if(t==='questions'){row.options=row.options.split('\n').map(s=>s.trim()).filter(Boolean);row.answer=row.answer-1}
    try{await api('a_save',{t,row});dlg.close();tab(cur)}catch(x){alert(x.message)}
  };
}
async function del(t,id){if(!confirm('Delete this '+t.slice(0,-1)+'? This cannot be undone.'))return;try{await api('a_del',{t,id});tab(cur)}catch(e){alert(e.message)}}
async function rv(id,revoked){try{await api('a_cert',{id,revoked});tab(cur)}catch(e){alert(e.message)}}
async function aiq(){
  const m=prompt('Module ID for the new questions?');if(m===null)return;
  const topic=prompt('Topic, or paste lesson text:');if(!topic)return;
  try{const r=await api('a_quiz',{module_id:+m||null,topic,n:5});alert(r.added+' questions added');tab('questions')}catch(e){alert(e.message)}
}
async function settings(p){
  const S=(await api('content')).settings,f=Array.isArray(S.faqs)?S.faqs:[];
  p.innerHTML=`<form class="card" id="sf"><label>Hero title<input name="hero_title" value="${esc(S.hero_title)}"></label><label>Hero subtitle<textarea name="hero_sub" rows="3">${esc(S.hero_sub)}</textarea></label><label>Pass mark (%)<input name="pass_percent" type="number" value="${S.pass_percent||60}"></label><label>Questions in final test<input name="exam_questions" type="number" value="${S.exam_questions||10}"></label><label>FAQs (one per line: Question | Answer)<textarea name="faqs" rows="8">${esc(f.map(x=>x.q+' | '+x.a).join('\n'))}</textarea></label><button class="btn">Save settings</button></form>`;
  $('#sf').onsubmit=async e=>{
    e.preventDefault();const v=fv(e.target);
    const faqs=v.faqs.split('\n').filter(l=>l.includes('|')).map(l=>{const[q,...a]=l.split('|');return{q:q.trim(),a:a.join('|').trim()}});
    try{await Promise.all([['hero_title',v.hero_title],['hero_sub',v.hero_sub],['pass_percent',+v.pass_percent],['exam_questions',+v.exam_questions],['faqs',faqs]].map(([key,value])=>api('a_set',{key,value})));alert('Settings saved')}catch(x){alert(x.message)}
  };
}
show();
</script>
</body>
</html>
